<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Keren Bayi Coding</title>
    <!-- Request dari Kak lwi, makasih ya! -->
    <style>
        body {
            font-family: sans-serif; min-height: 100vh; margin: 0;
            display: flex; justify-content: center; align-items: flex-start; padding-top: 80px;
            background: linear-gradient(135deg, #fbcfe8, #c4b5fd);
        }
        .menu { position: relative; padding-bottom: 8px; }
        .tombol {
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            color: white; border: none; border-radius: 12px;
            padding: 14px 24px; font-size: 18px; cursor: pointer;
            box-shadow: 0 6px 20px #8b5cf655;
        }
        /* panah kecil yang muter */
        .tombol::after { content: " v"; display: inline-block; transition: 0.3s; }
        .menu:hover .tombol::after { transform: rotate(180deg); }

        /* isi dropdown: disembunyikan pakai opacity biar bisa animasi */
        .isi {
            position: absolute; top: 100%; left: 0; width: 220px;
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px #0002;
            opacity: 0; visibility: hidden; transform: translateY(-8px) scale(0.96);
            transform-origin: top; transition: 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .menu:hover .isi { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

        .isi a {
            display: block; padding: 12px 18px; color: #4c1d95;
            text-decoration: none; transition: 0.2s;
        }
        .isi a:hover { background: #fce7f3; padding-left: 26px; }
    </style>
</head>
<body>
    <div class="menu">
        <button class="tombol">Menu Bayi</button>
        <div class="isi">
            <a href="#">Minum Susu</a>
            <a href="#">Bobo Siang</a>
            <a href="#">Main Mainan</a>
            <a href="#">Ngoding</a>
        </div>
    </div>
</body>
</html>
