<!-- Stroberi Muter Sambil Senyum -->
<!-- Request dari kak Nrgjwkdh -->
<!DOCTYPE html>
<html>
<head>
    <title>Stroberi Bayi Coding</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFE4EC;
        }

        /* wadah yang berputar terus */
        .stroberi {
            position: relative;
            width: 200px;
            height: 230px;
            animation: muter 3s linear infinite;
        }

        @keyframes muter {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* badan stroberi: bulat di atas, lancip di bawah */
        .badan {
            position: absolute;
            top: 40px;
            width: 200px;
            height: 190px;
            background: #E8304A;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
        }

        /* daun hijau di atas */
        .daun {
            position: absolute;
            top: 10px;
            left: 50px;
            width: 100px;
            height: 50px;
            background: #3DBE5A;
            border-radius: 50% 50% 20% 20%;
        }

        /* mata */
        .mata {
            position: absolute;
            top: 100px;
            width: 20px;
            height: 26px;
            background: #2B2333;
            border-radius: 50%;
        }
        .kiri { left: 55px; }
        .kanan { right: 55px; }

        /* senyum: setengah lingkaran bagian bawah */
        .senyum {
            position: absolute;
            top: 135px;
            left: 70px;
            width: 60px;
            height: 30px;
            border-bottom: 6px solid #2B2333;
            border-radius: 0 0 60px 60px;
        }

        /* biji stroberi */
        .biji {
            position: absolute;
            width: 8px;
            height: 12px;
            background: #FFE066;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="stroberi">
        <div class="badan"></div>
        <div class="daun"></div>
        <div class="mata kiri"></div>
        <div class="mata kanan"></div>
        <div class="senyum"></div>
        <div class="biji" style="top: 70px; left: 40px;"></div>
        <div class="biji" style="top: 75px; left: 150px;"></div>
        <div class="biji" style="top: 180px; left: 60px;"></div>
        <div class="biji" style="top: 185px; left: 135px;"></div>
        <div class="biji" style="top: 205px; left: 98px;"></div>
    </div>
</body>
</html>
